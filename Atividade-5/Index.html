<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Exercício 5</title></head>
<body>
  <script>
    let numero = Number(prompt("Digite um número para ver a tabuada:"));

    for (let i = 1; i <= 10; i++) {
      document.write(numero + " x " + i + " = " + (numero * i) + "<br>");
    }
  </script>
</body>
</html>
