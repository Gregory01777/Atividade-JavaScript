<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Par ou Impar</title>
</head>
<body>
  <script>
    let numero = Number(prompt("Digite um numero:"))
    if (numero % 2 == 0){
        alert("O numero e par.")
    }
    else {
        alert("O numero e impar.")
    }
  </script>
</body>
</html
