<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculador de Idade</title>
</head>
<body>
  <script>
   let anoNascimento = Number(prompt("Digite seu ano de nascimento:"));
    let anoAtual = new Date().getFullYear(); 
    let idade = anoAtual - anoNascimento;

alert(`Você tem ${idade} anos no ano atual.`);
  </script>
</body>
</html
